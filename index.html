<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demir Takip - Fitness Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #2e2e2e;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1, h2, h3 {
            margin-top: 0;
            font-weight: 600;
        }

        h1 {
            text-align: center;
            color: #fff;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        /* Gün Seçimi */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .day-btn {
            background-color: #2a2a2a;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .day-btn.selected {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Hareket Ekleme Alanı */
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        select, input {
            background-color: #252525;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input[type="text"] {
            flex: 2;
            min-width: 150px;
        }

        input[type="number"] {
            width: 80px;
        }

        button.primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Antrenman Programı Görünümü */
        .day-workout-card {
            background-color: #181818;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
        }

        .day-title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-item {
            background-color: #222;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 12px;
            color: #fff;
        }

        .set-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }

        .set-box {
            background-color: #2d2d2d;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .set-num {
            font-weight: bold;
            color: var(--accent-color);
            min-width: 50px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .weight-input, .reps-input {
            width: 60px;
            padding: 5px;
            font-size: 13px;
            text-align: center;
            border-radius: 4px;
        }

        .unit {
            font-size: 12px;
            color: var(--text-muted);
        }

        .delete-exercise {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .save-weights-btn {
            background-color: var(--success);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 12px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .save-weights-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Demir Takip</h1>

    <div class="section">
        <h3>1. Antrenman Günlerini Seç</h3>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="section">
        <h3>2. Programa Hareket Tanımla</h3>
        <div class="input-group">
            <select id="workoutDaySelect">
                <option value="">Gün Seç...</option>
            </select>
            <input type="text" id="exerciseInput" placeholder="Hareket adı (Örn: Plate Pinch)">
            <input type="number" id="setsInput" placeholder="Set" min="1" max="10" value="3">
            <button class="primary-btn" onclick="addExercise()">Programa Ekle</button>
        </div>
    </div>

    <div class="section" style="border-bottom: none;">
        <h3>3. Antrenman Programın ve Performans Takibi</h3>
        <div id="workoutProgramArea"></div>
    </div>
</div>

<script>
    const daysOfWeek = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
    
    let appState = JSON.parse(localStorage.getItem('fitnessAppState')) || {
        selectedDays: [],
        program: {} 
    };

    function init() {
        renderDaysGrid();
        updateDaySelect();
        renderProgram();
    }

    function saveToStorage() {
        localStorage.setItem('fitnessAppState', JSON.stringify(appState));
    }

    function renderDaysGrid() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        daysOfWeek.forEach(day => {
            const btn = document.createElement('button');
            btn.className = `day-btn ${appState.selectedDays.includes(day) ? 'selected' : ''}`;
            btn.innerText = day;
            btn.onclick = () => toggleDay(day);
            grid.appendChild(btn);
        });
    }

    function toggleDay(day) {
        if (appState.selectedDays.includes(day)) {
            if (appState.program[day] && appState.program[day].length > 0) {
                if (!confirm(`${day} gününü programdan çıkarmak bu güne ait hareketleri ve verileri SİLECEKTİR. Emin misiniz?`)) {
                    return;
                }
            }
            appState.selectedDays = appState.selectedDays.filter(d => d !== day);
            delete appState.program[day];
        } else {
            appState.selectedDays.push(day);
            appState.program[day] = [];
        }
        
        appState.selectedDays.sort((a, b) => daysOfWeek.indexOf(a) - daysOfWeek.indexOf(b));
        
        saveToStorage();
        renderDaysGrid();
        updateDaySelect();
        renderProgram();
    }

    function updateDaySelect() {
        const select = document.getElementById('workoutDaySelect');
        select.innerHTML = '<option value="">Gün Seç...</option>';
        appState.selectedDays.forEach(day => {
            const option = document.createElement('option');
            option.value = day;
            option.innerText = day;
            select.appendChild(option);
        });
    }

    function addExercise() {
        const daySelect = document.getElementById('workoutDaySelect');
        const exerciseInput = document.getElementById('exerciseInput');
        const setsInput = document.getElementById('setsInput');

        const selectedDay = daySelect.value;
        const exerciseName = exerciseInput.value.trim();
        const setCount = parseInt(setsInput.value);

        if (!selectedDay) {
            alert('Lütfen önce hareket eklemek istediğiniz günü seçin!');
            return;
        }
        if (!exerciseName) {
            alert('Lütfen bir hareket adı girin!');
            return;
        }
        if (isNaN(setCount) || setCount < 1) {
            alert('Set sayısı en az 1 olmalıdır!');
            return;
        }

        // Her set için hem ağırlığı hem tekrarı saklayacak yeni yapı:
        const defaultSetsData = Array.from({ length: setCount }, () => ({ weight: 0, reps: 0 }));

        const newExercise = {
            id: Date.now().toString(),
            name: exerciseName,
            sets: setCount,
            setsData: defaultSetsData
        };

        if (!appState.program[selectedDay]) {
            appState.program[selectedDay] = [];
        }

        appState.program[selectedDay].push(newExercise);
        exerciseInput.value = '';
        
        saveToStorage();
        renderProgram();
    }

    function deleteExercise(day, exerciseId) {
        if (confirm('Bu hareketi silmek istediğinize emin misiniz?')) {
            appState.program[day] = appState.program[day].filter(ex => ex.id !== exerciseId);
            saveToStorage();
            renderProgram();
        }
    }

    // Ağırlık ve Tekrar kaydetme fonksiyonu
    function saveWeights(day, exerciseId) {
        const exercise = appState.program[day].find(ex => ex.id === exerciseId);
        if (exercise) {
            exercise.setsData = [];
            for (let i = 0; i < exercise.sets; i++) {
                const weightVal = document.getElementById(`weight-${exerciseId}-${i}`).value;
                const repsVal = document.getElementById(`reps-${exerciseId}-${i}`).value;
                
                exercise.setsData.push({
                    weight: weightVal === '' ? 0 : parseFloat(weightVal),
                    reps: repsVal === '' ? 0 : parseInt(repsVal)
                });
            }
            saveToStorage();
            alert('Ağırlık ve tekrar verileri başarıyla kaydedildi!');
            renderProgram();
        }
    }

    function renderProgram() {
        const area = document.getElementById('workoutProgramArea');
        area.innerHTML = '';

        if (appState.selectedDays.length === 0) {
            area.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Henüz antrenman günü seçmediniz.</p>';
            return;
        }

        appState.selectedDays.forEach(day => {
            const dayCard = document.createElement('div');
            dayCard.className = 'day-workout-card';

            let exercisesHTML = '';
            const exercises = appState.program[day] || [];

            if (exercises.length === 0) {
                exercisesHTML = '<p style="color: var(--text-muted); font-size: 14px;">Bu güne henüz hareket eklenmedi.</p>';
            } else {
                exercises.forEach(ex => {
                    let setInputsHTML = '';
                    
                    for (let i = 0; i < ex.sets; i++) {
                        // Eski sürümden geçiş veya yeni data uyumluluğu için kontrol
                        let currentWeight = 0;
                        let currentReps = 0;

                        if (ex.setsData && ex.setsData[i]) {
                            currentWeight = ex.setsData[i].weight;
                            currentReps = ex.setsData[i].reps;
                        } else if (ex.weights && ex.weights[i]) {
                            currentWeight = ex.weights[i]; // eski datalar kaybolmasın diye yedek
                        }

                        setInputsHTML += `
                            <div class="set-box">
                                <span class="set-num">${i + 1}. Set</span>
                                <div class="input-wrapper">
                                    <input type="number" 
                                           id="weight-${ex.id}-${i}" 
                                           class="weight-input" 
                                           value="${currentWeight}" 
                                           step="0.5" 
                                           min="0"> 
                                    <span class="unit">kg</span>
                                </div>
                                <div class="input-wrapper">
                                    <input type="number" 
                                           id="reps-${ex.id}-${i}" 
                                           class="reps-input" 
                                           value="${currentReps}" 
                                           min="0"> 
                                    <span class="unit">Tekrar</span>
                                </div>
                            </div>
                        `;
                    }

                    exercisesHTML += `
                        <div class="exercise-item">
                            <div class="exercise-header">
                                <span>${ex.name} (${ex.sets} Set)</span>
                                <button class="delete-exercise" onclick="deleteExercise('${day}', '${ex.id}')">Sil</button>
                            </div>
                            <div class="set-row">
                                ${setInputsHTML}
                            </div>
                            <button class="save-weights-btn" onclick="saveWeights('${day}', '${ex.id}')">Verileri Kaydet</button>
                        </div>
                    `;
                });
            }

            dayCard.innerHTML = `
                <div class="day-title">
                    <span>${day}</span>
                </div>
                <div class="day-exercises">
                    ${exercisesHTML}
                </div>
            `;

            area.appendChild(dayCard);
        });
    }

    init();
</script>

</body>
</html>
